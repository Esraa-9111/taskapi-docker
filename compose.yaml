services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql://postgres:mysecretpassword@db:5432/tasks
    depends_on: [db]
  db:
    image: postgres:14
    environment:
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: tasks
    ports:
     - "5432:5432"
    volumes:
      - taskdata:/var/lib/postgresql/data

volumes:
  taskdata: